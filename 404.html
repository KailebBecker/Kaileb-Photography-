<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Kaileb Becker Photography</title>
  <!-- Self-contained on purpose: a 404 can be served from any path, so no relative CSS/JS/image URLs. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f3ec; color: #3a2f27; font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 1.5rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; font-weight: 600; }
    p { margin: 0 0 1.5rem; color: #5c4d3f; font-family: system-ui, sans-serif; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.6em; border-radius: 999px; background: #55744c; color: #fbf8f2; text-decoration: none; font-family: system-ui, sans-serif; font-weight: 500; }
    a:focus-visible { outline: 2px solid #3a2f27; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>That page isn't here</h1>
    <p>The link may be old or mistyped.</p>
    <a id="home" href="/">Go to the homepage</a>
  </main>
  <script>
    // Works at the site root and under a GitHub Pages project path (/<repo>/).
    var parts = location.pathname.split("/");
    var base = location.hostname.slice(-10) === ".github.io" && parts[1] ? "/" + parts[1] + "/" : "/";
    document.getElementById("home").href = base;
  </script>
</body>
</html>
